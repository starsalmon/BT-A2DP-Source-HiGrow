; Bluetooth A2DP Source (TX) test for ESP32 (LilyGo HiGrow)
;
; This is a standalone project separate from yoRadio.
; Pair/connects to an existing Bluetooth speaker/headphones (A2DP Sink) and streams a test tone.
;
; Notes:
; - Requires an ESP32 with Classic Bluetooth (BR/EDR). ESP32-S3/C6 won't work for A2DP.
;

[env:higrow_a2dp_source]
; Pinned pioarduino platform (cached under ~/.platformio — no zip re-fetch each build)
platform = espressif32@55.3.36
platform_packages =
    platformio/framework-arduinoespressif32@https://github.com/espressif/arduino-esp32/releases/download/3.3.6/esp32-core-3.3.6.tar.xz
    platformio/framework-arduinoespressif32-libs@https://github.com/espressif/arduino-esp32/releases/download/3.3.6/esp32-core-3.3.6-libs.tar.xz
board = esp32dev
framework = arduino


; Match HiGrow repo default (gives more headroom, harmless for this test)
board_build.partitions = huge_app.csv

lib_deps =
  https://github.com/pschatzmann/ESP32-A2DP.git

; ---- Monitor / Upload ----
monitor_speed = 115200

; HiGrow: 921600 fails on this board/cable; 115200 is the confirmed-working upload speed.
upload_speed = 115200
upload_protocol = esptool
upload_flags =
    --chip=esp32
    --before=default_reset
    --after=hard_reset
    --baud=115200
build_flags =
    -DHIGROW_LOG_DISCOVERY=1
    -DHIGROW_LOG_TELEMETRY=1
    -DPCM_RING_BYTES=16384
    -DCORE_DEBUG_LEVEL=3

; Generic ESP32-WROOM devkit (NodeMCU-32S) as the BT companion for April's Speaker.
; Same firmware; pins from include/options.h (COMPANION_BOARD_NODEMCU32S block).
[env:nodemcu32s_bt_companion]
extends = env:higrow_a2dp_source
board = nodemcu-32s
; A2DP RX name "April's Speaker" is set in that block too.
; inherit the HiGrow flags (fix15 PCM_RING_BYTES=16384, logging) + board select
build_flags =
    ${env:higrow_a2dp_source.build_flags}
    -DCOMPANION_BOARD_NODEMCU32S=1
upload_speed = 460800
upload_flags =
    --chip=esp32
    --before=default_reset
    --after=hard_reset
    --baud=460800
