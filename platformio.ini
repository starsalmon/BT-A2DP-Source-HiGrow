; Bluetooth A2DP Source (TX) test for ESP32 (LilyGo HiGrow)
;
; This is a standalone project separate from yoRadio.
; Pair/connects to an existing Bluetooth speaker/headphones (A2DP Sink) and streams a test tone.
;
; Notes:
; - Requires an ESP32 with Classic Bluetooth (BR/EDR). ESP32-S3/C6 won't work for A2DP.
;

[env:higrow_a2dp_source]
; Use the same pioarduino platform as yoRadio (avoids flaky CDN mirrors)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip
board = esp32dev
framework = arduino


; Match HiGrow repo default (gives more headroom, harmless for this test)
board_build.partitions = huge_app.csv

lib_deps =
  https://github.com/pschatzmann/ESP32-A2DP.git

; ---- Monitor / Upload ----
monitor_speed = 115200

; Some ESP32 boards are picky about reset/baud; these settings were confirmed working.
; You can also simplify back to `upload_speed = 921600` if your board auto-resets reliably.
upload_protocol = esptool
upload_flags =
    --chip=esp32
    --before=default_reset
    --after=hard_reset
    --baud=921600